<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Mini Guitar Hero</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      overflow: hidden;
      text-align: center;
    }

    .game {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 50px;
    }

    .track {
      background: #222;
      width: 80px;
      height: 500px;
      position: relative;
      border: 2px solid #444;
    }

    .note {
      width: 100%;
      height: 20px;
      background: blue;
      position: absolute;
      top: 0;
      left: 0;
    }

    .hit-zone {
      height: 30px;
      background: rgba(4, 238, 23, 0.2);
      position: absolute;
      bottom: 0;
      width: 100%;
    }

    #start {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>Mini Guitar Hero</h1>

  <div class="game" id="game">
    <div class="track" data-key="65">
      <div class="hit-zone"></div>
    </div>
    <div class="track" data-key="83">
      <div class="hit-zone"></div>
    </div>
    <div class="track" data-key="68">
      <div class="hit-zone"></div>
    </div>
    <div class="track" data-key="70">
      <div class="hit-zone"></div>
    </div>
  </div>

  <p id="score">Pontuação: 0</p>

  <button id="start">começar</button>

  <!-- Audio p música -->
  <audio id="musica" src="" preload="auto"></audio>

  <script>
    //time
    const notes = [
      { time: 1000, track: 65 },
      { time: 1200, track: 65 },
      { time: 1500, track: 65 },
      { time: 1800, track: 83 },
      { time: 1900, track: 68 },
      { time: 2200, track: 70 },
      { time: 2400, track: 65 },
      { time: 2600, track: 70 },
      { time: 2900, track: 65 },
      { time: 3100, track: 83 },
      { time: 3300, track: 68 },
      { time: 3600, track: 70 },
      // aqui é para sincronizar a música
    ];

    let score = 0;
    const game = document.getElementById("game");
    const musica = document.getElementById("musica");
    const startButton = document.getElementById("start");

    function spawnNote(note) {
      const track = document.querySelector(`.track[data-key="${note.track}"]`);
      if (!track) return;
      
      const el = document.createElement("div");
      el.classList.add("note");
      track.appendChild(el);

      let pos = 0;
      const speed = 5; // Velocidade da nota indo p baixo 

      const interval = setInterval(() => {
        pos += speed;
        el.style.top = pos + "px";
        if (pos >= 470) {
          clearInterval(interval);
          if (el.parentElement) el.parentElement.removeChild(el);
        }
      }, 16); // Aproximadamente 60 frames por segundo
    }

    // Começar o jogo
    startButton.addEventListener("click", () => {
      musica.play();
      const startTime = Date.now();

      notes.forEach(note => {
        setTimeout(() => spawnNote(note), note.time);
      });

      startButton.style.display = "none"; // Esconde o botão
    });

    // Apertar teclas
    document.addEventListener("keydown", e => {
      const track = document.querySelector(`.track[data-key="${e.keyCode}"]`);
      if (!track) return;

      // Efeito de "acerto" na zona(tipo uma piscada)OBS:essa bomba pisca só de clicar, não precisa acertar no timing.
      const hitZone = track.querySelector(".hit-zone");
      hitZone.style.background = "rgba(0,255,0,0.7)";
      setTimeout(() => {
        hitZone.style.background = "rgba(4, 238, 23, 0.2)";
      }, 100);

      // Verificar se acertou a nota
      const notesOnTrack = track.querySelectorAll(".note");
      notesOnTrack.forEach(note => {
        const noteTop = parseInt(note.style.top);
        if (noteTop > 440 && noteTop < 500) {
          track.removeChild(note);
          score += 10;
          document.getElementById("score").textContent = `Pontuação: ${score}`;
        }
      });
    });
  </script>

</body>

</html>
