    <style>
        
        #phaser-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .hit-zone {
            height:126px;

            background-repeat: no-repeat;
            background-size: cover;
            margin: 0px;
            padding: 0px;
            border: 0px;
        }

        .trilha {
            background: #585858;
            width: 120px;
            height: 800px;
            position: absolute;
            border: 2px solid #444;
        }
        
        #verde {
            left: 700px;
            border: 5px solid green;
        }

        #vermelho {
            left: 850px;
            border: 5px solid red;
        }

        #amarelo {
            left: 1000px;
            border: 5px solid yellow;
        }

        #azul {
            left: 1150px;
            border: 5px solid blue;

            window.location.href = "home.html";

        //!!!!!!! DESCOMENTAR DEPOIS DE TERMINAR DE TESTAR!!!
        let scoreRef = document.getElementById("score");

            if (!trilha) return;
